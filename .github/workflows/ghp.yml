name: Deploy to safe26.hccs.dev GitHub Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
jobs:
  ghp:
    name: Build/Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm-workspace.yaml references `../../slidev/packages/*` (matches the
      # local layout where safe26 lives at `~/c/hccs/safe26` and the fork at
      # `~/c/slidev`). Clone the fork to the same relative path under the
      # runner work dir so the workspace resolves identically.
      - name: Clone slidev fork
        run: git clone --depth 1 https://github.com/Open-Athena/slidev.git ../../slidev
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      # Slidev fork ships TS source only (no `dist/` in git); install its own
      # workspace deps (tsdown etc.) and build its packages so `@slidev/cli`
      # has a runnable `dist/cli.mjs`. Must happen BEFORE the deck's install,
      # because the deck's `pnpm-workspace.yaml` links to the fork's packages.
      - name: Install + build slidev fork
        working-directory: ../../slidev
        run: |
          pnpm install --no-frozen-lockfile
          pnpm build
      - run: pnpm i --no-frozen-lockfile
      - run: pnpm build
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
